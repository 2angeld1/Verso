version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: verso-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: verso
      POSTGRES_PASSWORD: verso_secret
      POSTGRES_DB: verso
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verso"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
